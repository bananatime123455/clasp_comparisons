name: Sync to GitLab

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitLab
        run: |
          git remote add gitlab https://bananatime123455:${{ secrets.GITLAB_PAT }}@gitlab.com/smph/isnl/baseline_comaprisons.git
          git push gitlab --all
          git push gitlab --tags