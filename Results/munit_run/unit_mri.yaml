# Auto-generated by MUNITPipeline
image_display_iter: 10
image_save_iter: 5
snapshot_save_iter: 100
max_iter: 100
logging_iter: 1

trainer:
    strict_resume: False
    type: imaginaire.trainers.munit
    model_average_config:
        enabled: True
    amp_config:
        enabled: True
    gan_mode: hinge
    perceptual_mode: vgg19
    perceptual_layers: relu_4_1
    loss_weight:
        gan: 1
        image_recon: 1
        content_recon: 1
        style_recon: 1
        perceptual: 0
        cycle_recon: 1
        gp: 0
        consistency_reg: 0
    init:
        type: orthogonal
        gain: 1

gen_opt:
    type: adam
    lr: 0.0001
    adam_beta1: 0.5
    adam_beta2: 0.999
    lr_policy:
        type: constant

dis_opt:
    type: adam
    lr: 0.0004
    adam_beta1: 0.5
    adam_beta2: 0.999
    lr_policy:
        type: constant

gen:
    type: imaginaire.generators.munit
    latent_dim: 8
    num_filters: 64
    num_filters_mlp: 256
    num_res_blocks: 4
    num_mlp_blocks: 2
    num_downsamples_style: 4
    num_downsamples_content: 2
    content_norm_type: instance
    style_norm_type: none
    decoder_norm_type: instance
    weight_norm_type: spectral
    pre_act: True

dis:
    type: imaginaire.discriminators.munit
    patch_wise: False
    num_filters: 32
    max_num_filters: 512
    num_layers: 6
    activation_norm_type: none
    weight_norm_type: spectral

# MUNIT is many-to-many: at test time it needs to know which direction to
# translate, and whether to sample a random style code or use the style
# encoded from an example image in the target domain. random_style: False
# gives deterministic, comparable metrics against a fixed ground-truth b.
inference_args:
    a2b: True
    random_style: False

data:
    name: brats_mri_munit
    type: imaginaire.datasets.h5_mri
    modality_a: 't1ce_transformed'
    modality_b: 't2_transformed'
    modality_a_display: 'Axial_T1_post'
    modality_b_display: 'Axial_T2'
    train_file_list: '/home/theperfectbanana/Yu/comparisons/Results/munit_run/train_files.txt'
    val_file_list: '/home/theperfectbanana/Yu/comparisons/Results/munit_run/val_files.txt'
    test_file_list: '/home/theperfectbanana/Yu/comparisons/Results/munit_run/test_files.txt'
    num_workers: 4
    input_types:
        - images_a:
            ext: ~
            num_channels: 3
            normalize: True
        - images_b:
            ext: ~
            num_channels: 3
            normalize: True
    train:
        roots:
            - '/home/theperfectbanana/Yu/comparisons/Results/munit_run'
        batch_size: 1
        augmentations:
            resize_smallest_side: 256
            random_scale_limit: 0.1
            horizontal_flip: True
            random_crop_h_w: 256, 256
    test:
        roots:
            - '/home/theperfectbanana/Yu/comparisons/Results/munit_run'
        batch_size: 1
        augmentations:
            resize_smallest_side: 256
            center_crop_h_w: 256, 256
    val:
        roots:
            - '/home/theperfectbanana/Yu/comparisons/Results/munit_run'
        batch_size: 1
        augmentations:
            resize_smallest_side: 256
            center_crop_h_w: 256, 256

test_data:
    type: imaginaire.datasets.h5_mri
    input_types:
        - images_a:
              ext: ~
              num_channels: 3
              normalize: True
        - images_b:
              ext: ~
              num_channels: 3
              normalize: True
    paired: True
    test:
        is_lmdb: False
        roots:
            - '/home/theperfectbanana/Yu/comparisons/Results/munit_run'
        batch_size: 1
        augmentations:
            resize_smallest_side: 256
            center_crop_h_w: 256, 256