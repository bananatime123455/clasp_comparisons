# Auto-generated by UNITPipeline
image_display_iter: 2000
image_save_iter: 5000
snapshot_save_iter: 5000
max_iter: 10000
logging_iter: 50

trainer:
    type: imaginaire.trainers.unit
    model_average_config:
        enabled: True
    gan_mode: least_square
    perceptual_mode: vgg19
    perceptual_layers: relu_4_1
    loss_weight:
        gan: 1
        image_recon: 1
        cycle_recon: 1
        perceptual: 0
    init:
        type: normal
        gain: 0.02

gen_opt:
    type: adam
    lr: 0.0001
    adam_beta1: 0.
    adam_beta2: 0.999
    lr_policy:
        iteration_mode: False
        type: step
        step_size: 100
        gamma: 0.5

dis_opt:
    type: adam
    lr: 0.0001
    adam_beta1: 0.
    adam_beta2: 0.999
    lr_policy:
        iteration_mode: False
        type: step
        step_size: 100
        gamma: 0.5

gen:
    type: imaginaire.generators.unit
    num_filters: 48
    num_res_blocks: 4
    num_downsamples_content: 2
    content_norm_type: instance
    decoder_norm_type: instance
    weight_norm_type: none
    pre_act: True
    all_res: True

dis:
    type: imaginaire.discriminators.unit
    num_discriminators: 3
    kernel_size: 3
    num_filters: 48
    num_layers: 4
    max_num_filters: 512
    weight_norm_type: spectral

data:
    name: brats_mri_unit
    type: imaginaire.datasets.h5_mri
    modality_a: 'Axial_T1_post'
    modality_b: 'Axial_T2'
    train_file_list: 'Results/unit_run/train_files.txt'
    val_file_list: 'Results/unit_run/val_files.txt'
    num_workers: 4
    input_types:
        - images_a:
            ext: ~
            num_channels: 3
            normalize: True
        - images_b:
            ext: ~
            num_channels: 3
            normalize: True
    train:
        roots:
            - 'Results/unit_run'
        batch_size: 8
        augmentations:
            resize_smallest_side: 256
            random_scale_limit: 0.1
            horizontal_flip: True
            random_crop_h_w: 256, 256
    val:
        roots:
            - 'Results/unit_run'
        batch_size: 1
        augmentations:
            resize_smallest_side: 256
            center_crop_h_w: 256, 256

test_data:
    type: imaginaire.datasets.h5_mri
    input_types:
        - images_a:
              ext: ~
              num_channels: 3
              normalize: True
        - images_b:
              ext: ~
              num_channels: 3
              normalize: True
    paired: False
    test:
        is_lmdb: False
        roots:
            - 'Results/unit_run'
        batch_size: 1
        augmentations:
            resize_smallest_side: 256
            center_crop_h_w: 256, 256