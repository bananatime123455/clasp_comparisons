  - libitk>=5.4
  - hdf5

  # ── Computer vision (from cycleGan) ─────────────────────────────────────────
  - libopencv>=4.13
  - opencv>=4.13
  - py-opencv>=4.13
  - ffmpeg>=8.0

  # ── Dask / distributed ──────────────────────────────────────────────────────
