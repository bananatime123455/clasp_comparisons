  - traitlets
  - wcwidth
  - zeromq          # unpinned — let conda pick a build compatible with krb5/libsodium

  # ── Web / networking ────────────────────────────────────────────────────────
  - certifi
  - charset-normalizer
  - idna
  - requests
  - urllib3
  - h2
  - hpack
  - hyperframe
  - pysocks
  - libcurl
