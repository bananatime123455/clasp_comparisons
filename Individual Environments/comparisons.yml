name: comparisons
channels:
  - conda-forge
dependencies:
  # ── Python ──────────────────────────────────────────────────────────────────
  # Python 3.12: cycleGan's stable torch (2.10.0+cu128) is built for py312.
  # clasp_2D's torch was a nightly dev build (2.8.0.dev) for py311.
  - python=3.12

  # ── CUDA / GPU stack ────────────────────────────────────────────────────────
  # Pin major.minor only; let conda pick compatible patch builds.
  - cuda-version=12.8        # ← was 12.9; align with pip nvidia wheels (all 12.8.x)
  - cudnn>=9.10

  # ── TensorFlow ──────────────────────────────────────────────────────────────
  # cycleGan 2.19.1 > clasp_2D 2.18.0 — take the newer version.
  - tensorflow=2.19.1
  - keras>=3.13
  - tensorboard>=2.19
  - tensorboard-data-server
  - absl-py
  - astunparse
  - flatbuffers
  - gast
  - google-pasta
  - grpcio
  - h5py
  - markdown
  - ml_dtypes
  - namex
  - opt_einsum
  - optree
  - protobuf
  - termcolor
  - wrapt
  - werkzeug

  # ── Core scientific / numeric ───────────────────────────────────────────────
  - numpy>=2.3
  - scipy==1.15.1
  - pandas>=3.0
  - matplotlib>=3.10
  - scikit-learn>=1.8
  - scikit-image>=0.26
  - statsmodels>=0.14
  - patsy
  - networkx>=3.6
  - sympy>=1.14
  - libblas=*=*openblas
  - libcblas=*=*openblas
  - liblapack=*=*openblas
  - liblapacke=*=*openblas
  - libopenblas
  - contourpy
  - cycler
  - fonttools
  - kiwisolver
  - pillow>=12
  - pyparsing
  - python-dateutil
  - fftw
  - wandb

  # ── Medical imaging (from clasp_2D) ─────────────────────────────────────────
